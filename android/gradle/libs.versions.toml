[versions]
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
exifinterface = "1.4.2"
heifwriter = "1.1.0"
coroutines = "1.11.0"
print = "1.1.0"
documentfile = "1.1.0"
zxing = "3.5.4"
tesseract = "4.9.0"
pdfbox = "2.0.27.0"
media3 = "1.11.1"
jsoup = "1.23.2"
commonmark = "0.30.1"
junit = "4.13.2"
json = "20240303"
kxml = "2.3.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
androidx-heifwriter = { module = "androidx.heifwriter:heifwriter", version.ref = "heifwriter" }
androidx-print = { module = "androidx.print:print", version.ref = "print" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
tesseract = { module = "cz.adaptech.tesseract4android:tesseract4android", version.ref = "tesseract" }
pdfbox = { module = "com.tom-roush:pdfbox-android", version.ref = "pdfbox" }
media3-transformer = { module = "androidx.media3:media3-transformer", version.ref = "media3" }
media3-effect = { module = "androidx.media3:media3-effect", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-muxer = { module = "androidx.media3:media3-muxer", version.ref = "media3" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
# The real org.json for tests on the computer, where Android's own is only an empty shell.
json = { module = "org.json:json", version.ref = "json" }
# The XML reader Android itself is built on, for the same reason.
kxml = { module = "net.sf.kxml:kxml2", version.ref = "kxml" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
